name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Build and Tests
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: focus-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    permissions:
      contents: write
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          FOCUS_RELEASE_KEYSTORE_BASE64: ${{ secrets.FOCUS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FOCUS_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::FOCUS_RELEASE_KEYSTORE_BASE64 secret is required for release tags"
            exit 1
          fi
          echo "$FOCUS_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build Release Artifacts
        env:
          FOCUS_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          FOCUS_RELEASE_STORE_PASSWORD: ${{ secrets.FOCUS_RELEASE_STORE_PASSWORD }}
          FOCUS_RELEASE_KEY_ALIAS: ${{ secrets.FOCUS_RELEASE_KEY_ALIAS }}
          FOCUS_RELEASE_KEY_PASSWORD: ${{ secrets.FOCUS_RELEASE_KEY_PASSWORD }}
        run: |
          for variable in FOCUS_RELEASE_STORE_FILE FOCUS_RELEASE_STORE_PASSWORD FOCUS_RELEASE_KEY_ALIAS FOCUS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is required for release tags"
              exit 1
            fi
          done
          ./gradlew bundleRelease assembleRelease

      - name: Verify Release Signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee bundle-signature.txt
          grep -q 'jar verified' bundle-signature.txt

      - name: Name Release Artifacts
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "focus-launcher-${{ github.ref_name }}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "focus-launcher-${{ github.ref_name }}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            focus-launcher-${{ github.ref_name }}-release.aab
            focus-launcher-${{ github.ref_name }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Signing Material
        if: always()
        run: rm -f release-keystore.jks
